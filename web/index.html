<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIN ZONE — Free 1v1 football tournaments</title>
<meta name="description" content="Register free, get your fixture, play on your phone. The app verifies the result and the bracket updates live.">
<meta name="theme-color" content="#0b0d0c">
<meta property="og:title" content="WIN ZONE — Free 1v1 football tournaments">
<meta property="og:description" content="Register free, get your fixture, play on your phone. The app verifies the result and the bracket updates live.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
</head>
<body>
<main id="main">
<section class="hero"><div class="wrap hero-grid">
  <div>
    <span class="eyebrow" data-i18n="hero.kicker"></span>
    <h1 data-i18n-html="hero.title"></h1>
    <p class="lede" data-i18n="hero.lede"></p>
    <div class="hero-actions">
      <a class="btn" href="#tournaments" data-i18n="hero.cta1"></a>
      <a class="btn ghost" href="/organizers.html" data-i18n="hero.cta2"></a>
    </div>
  </div>
  <svg class="hero-art" viewBox="0 0 420 380" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
  <path d="M10 30h90v50M10 100h90V80M100 55h70" /><path d="M10 160h90v50M10 230h90v-20M100 185h70"/>
  <path d="M10 290h90v30M10 350h90v-30M100 320h70"/>
  <path d="M170 55h60v70M170 185h60v-60M230 125h70"/>
  <path d="M170 320h60v-50M230 270h0M230 270v-20h0" />
  <path d="M230 295v-45h70v-125" />
  <path class="hot" stroke="#c8f43a" stroke-width="3" d="M300 125h110"/>
  <rect class="hot" x="404" y="115" width="14" height="20" fill="#c8f43a" stroke="none"/>
</svg>
</div></section>

<section class="section" id="tournaments"><div class="wrap">
  <div class="section-head"><div><span class="eyebrow" data-i18n="live.eyebrow"></span><h2 data-i18n="live.title"></h2></div></div>
  <div id="t-list" class="t-list" aria-live="polite"><div class="empty" data-i18n="c.loading"></div></div>
</div></section>

<section class="partners" id="partners" hidden><div class="wrap">
  <span class="k" data-i18n="sp.partners"></span><div class="sp-row" id="sp-row"></div>
</div></section>

<section class="section on-bone" id="how"><div class="wrap">
  <div class="section-head"><div><span class="eyebrow" data-i18n="how.eyebrow"></span><h2 data-i18n="how.title"></h2></div></div>
  <div class="steps">
    <div class="step"><span class="n">01</span><h3 data-i18n="how.1t"></h3><p data-i18n="how.1b"></p></div>
    <div class="step"><span class="n">02</span><h3 data-i18n="how.2t"></h3><p data-i18n="how.2b"></p></div>
    <div class="step"><span class="n">03</span><h3 data-i18n="how.3t"></h3><p data-i18n="how.3b"></p></div>
  </div>
</div></section>

<section class="section"><div class="wrap split">
  <div><span class="eyebrow" data-i18n="fair.eyebrow"></span><h2 data-i18n="fair.title"></h2></div>
  <ul class="rules">
    <li><span class="k">01</span><div><b data-i18n="fair.1t"></b><span class="mute" data-i18n="fair.1b"></span></div></li>
    <li><span class="k">02</span><div><b data-i18n="fair.2t"></b><span class="mute" data-i18n="fair.2b"></span></div></li>
    <li><span class="k">03</span><div><b data-i18n="fair.3t"></b><span class="mute" data-i18n="fair.3b"></span></div></li>
    <li><span class="k">04</span><div><b data-i18n="fair.4t"></b><span class="mute" data-i18n="fair.4b"></span></div></li>
  </ul>
</div></section>

<section class="section on-bone"><div class="wrap split">
  <div><span class="eyebrow" data-i18n="org.eyebrow"></span><h2 data-i18n="org.title"></h2></div>
  <div><p class="lede" data-i18n="org.body"></p><a class="btn" href="/organizers.html" data-i18n="org.cta"></a></div>
</div></section>
</main>
<script type="module" src="/js/home.js"></script>
</body>
</html>
