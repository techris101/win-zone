name: Keep database awake

# Free Supabase projects pause after about a week without activity. This pings the project daily.
# If the ping fails, GitHub emails the repository owner.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Public values (the anon key is designed to be public).
      SUPABASE_URL: https://jfniylmbogodgozcczln.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impmbml5bG1ib2dvZGdvemNjemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzOTUyMDUsImV4cCI6MjEwNTk3MTIwNX0.Y1nQdsJZG8SJL4-BziGu7A13_YDnR-Ud2vX-wB5bro4
    steps:
      - name: Ping
        run: |
          # Any response from the API counts as "awake". A 404 before the tables exist is fine.
          code=$(curl -sS --retry 3 --max-time 20 -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/games?select=slug&limit=1")
          echo "HTTP $code"
          case "$code" in 200|404) exit 0 ;; *) exit 1 ;; esac
