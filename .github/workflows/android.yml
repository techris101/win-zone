name: Android app
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build test app
        run: gradle -p android assembleDebug testDebugUnitTest --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk winzone-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: winzone-test-apk, path: winzone-test.apk }
      - name: Publish as the "app-latest" download
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest winzone-test.apk --title "WIN ZONE app (test version)" --notes "Test version built from ${GITHUB_SHA::7}. Install on Android: allow installs from this source when asked." --prerelease --target "$GITHUB_SHA"
