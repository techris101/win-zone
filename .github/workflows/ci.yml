name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and tests
        run: supabase/tests/run_local.sh "postgresql://postgres:postgres@localhost:5432/winzone_test"
      - name: One-time legacy wipe script (safety checks)
        run: supabase/tests/run_reset_test.sh "postgresql://postgres:postgres@localhost:5432/winzone_reset"

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Required files
        run: |
          for f in index.html t/index.html auth.html me.html matchroom.html admin.html organizers.html terms.html privacy.html contact.html 404.html _redirects _headers; do
            test -f "web/$f" || { echo "missing web/$f"; exit 1; }
          done
      - name: Public pages must not name the game
        run: |
          if grep -rniE "\bDLS\b|dream league" web/ ; then echo "game name found in public files"; exit 1; fi
