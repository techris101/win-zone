<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Access | WIN ZONE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="background: #06080c;">

    <!-- =============================================
         ADMIN LOGIN MAIN
    ================================================= -->
    <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
        <div class="wz-container-sm">
            
            <div class="wz-card" style="border-color: rgba(239, 68, 68, 0.25);">
                <div style="text-align: center; margin-bottom: 24px;">
                    <div class="wz-badge wz-badge-warning" style="margin-bottom: 8px;">
                        RESTRICTED ADMINISTRATIVE AREA
                    </div>
                    <div class="wz-logo" style="justify-content: center; margin-bottom: 12px;">
                        <div class="wz-logo-badge" style="background: var(--wz-accent); color: #000;">W</div>
                        <div>WIN <span>ADMIN</span></div>
                    </div>
                    <p style="color: var(--wz-text-muted); font-size: 13px;">
                        Authorized staff and regulatory oversight personnel only. All access attempts are recorded.
                    </p>
                </div>

                <form id="adminLoginForm">
                    <div class="wz-form-group">
                        <label class="wz-label" for="adminEmail">Administrator Staff ID / Email</label>
                        <input type="text" id="adminEmail" class="wz-input" placeholder="admin@winzone.platform" required value="admin@winzone.platform">
                    </div>

                    <div class="wz-form-group">
                        <label class="wz-label" for="adminPassword">Master Password</label>
                        <input type="password" id="adminPassword" class="wz-input" placeholder="••••••••••••" required value="winzone-admin-2026">
                    </div>

                    <div class="wz-form-group">
                        <label class="wz-label" for="adminPin">Hardware / Security 6-Digit Token</label>
                        <input type="text" id="adminPin" class="wz-input" placeholder="123456" maxlength="6" style="letter-spacing: 0.15em;" required value="984210">
                    </div>

                    <div id="adminStatus" style="display: none; margin-bottom: 16px;"></div>

                    <button type="submit" id="btnAdminLogin" class="wz-btn wz-btn-primary wz-btn-block wz-btn-lg">
                        Authenticate & Access Dashboard
                    </button>
                </form>

                <div class="wz-notice warning" style="margin-top: 24px; font-size: 12px;">
                    <strong>Notice:</strong> Unauthorized access attempts are monitored, logged, and subject to legal prosecution under computer security legislation.
                </div>

                <div style="text-align: center; margin-top: 18px;">
                    <a href="index.html" style="font-size: 12.5px; color: var(--wz-text-dim); text-decoration: underline;">
                        &larr; Return to Public Platform
                    </a>
                </div>
            </div>

        </div>
    </main>

    <script src="js/global.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("adminLoginForm");
            const statusEl = document.getElementById("adminStatus");

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                const btn = document.getElementById("btnAdminLogin");
                btn.disabled = true;
                btn.textContent = "Verifying Credentials...";

                setTimeout(function () {
                    sessionStorage.setItem("admin_auth", "true");
                    WINZONE.status(statusEl, "Administrative access granted. Redirecting to management console...", "success");
                    setTimeout(() => {
                        window.location.href = "admin.html";
                    }, 1000);
                }, 900);
            });
        });
    </script>
</body>
</html>
